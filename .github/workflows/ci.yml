# 한국어 주석: GitHub Actions를 활용한 에이전트 하네스 CI 검증 워크플로우입니다.
name: Agent Harness CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
    # 1. 소스코드 체크아웃
    - name: Checkout Source Code
      uses: actions/checkout@v3

    # 2. Node.js 런타임 환경 셋업 (테스트 프로젝트가 nodejs일 경우의 예시)
    - name: Setup Node.js Environment
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    # 3. 하네스 파일들의 실행 권한 복구
    - name: Restore Script Executable Permissions
      run: |
        chmod +x .agent/bin/*.sh
        chmod +x .agent/hooks/*.sh

    # 4. 하네스 초기화 수행
    - name: Initialize Agent Harness
      run: |
        ./.agent/bin/init.sh

    # 5. 하네스 통합 린트 및 기동 테스트 수행 (틀 검증)
    # 린트가 통과되지 않거나 기동 테스트가 에러를 뿜으면 빌드가 실패(Exit 1)로 종료됩니다.
    - name: Run Lint & Smoke Tests
      run: |
        ./.agent/bin/run-test.sh
